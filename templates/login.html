<!DOCTYPE html>
<html>
<head>
    <title>Login - Body of Christ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #8b0000; margin: 0; }
        .login-card { background: white; padding: 35px; border-radius: 15px; text-align: center; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { color: #8b0000; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d4af37; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
        p { font-size: 0.85em; color: #666; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Welcome</h2>
        {% if error %}
        <p style="color:#8b0000; font-weight:bold;">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input name="username" placeholder="Your Name" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Enter App</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('register') }}" style="color:#8b0000;">Create one</a></p>
        <p><a href="{{ url_for('forgot_password') }}" style="color:#8b0000;">Forgot password?</a></p>
    </div>
</body>
</html>
